services:
  mysql:
    image: mysql:8.0
    container_name: english_tracker_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MYSQL_USER} -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - english_tracker_net


  # UI oficial de MySQL Workbench en el navegador (vía KasmVNC)
  mysql-workbench:
    image: lscr.io/linuxserver/mysql-workbench:latest
    container_name: english_tracker_workbench
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
    ports:
      - "${WORKBENCH_HTTP_PORT:-3000}:3000"
      - "${WORKBENCH_HTTPS_PORT:-3001}:3001"
    cap_add:
      - IPC_LOCK
    volumes:
      - workbench_config:/config
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - english_tracker_net

  backend:
    build:
      context: ./Backend/EnglishSkillTrackerCRUD
      dockerfile: Dockerfile
      target: dev
    container_name: english_tracker_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "35729:35729"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-36000}
    volumes:
      - ./Backend/EnglishSkillTrackerCRUD/src:/app/src
      - ./Backend/EnglishSkillTrackerCRUD/pom.xml:/app/pom.xml
      - maven_data:/root/.m2
    develop:
      watch:
        - action: sync
          path: ./Backend/EnglishSkillTrackerCRUD/src
          target: /app/src
        - action: rebuild
          path: ./Backend/EnglishSkillTrackerCRUD/pom.xml
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - english_tracker_net

  frontend:
    build:
      context: ./Frontend/English-Skills-Tracker
      dockerfile: Dockerfile
      target: dev
    container_name: english_tracker_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./Frontend/English-Skills-Tracker:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    develop:
      watch:
        - action: sync
          path: ./Frontend/English-Skills-Tracker/src
          target: /app/src
        - action: rebuild
          path: ./Frontend/English-Skills-Tracker/package.json
    depends_on:
      - backend
    networks:
      - english_tracker_net

volumes:
  mysql_data:
  workbench_config:
  maven_data:
  frontend_node_modules:
  frontend_angular_cache:

networks:
  english_tracker_net:
    driver: bridge
