spring.application.name=EnglishSkillTrackerCRUD

# Importa automáticamente el archivo .env en ejecuciones locales (desde la raíz o carpeta del backend)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]

# Base de Datos
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:englishskilltracker}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:America/Bogota}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Security (JWT)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:36000}

# Hot Reload (Spring Boot DevTools)
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.livereload.enabled=true

